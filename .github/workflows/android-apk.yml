# Builds the Android APK in the cloud. Push this folder to a GitHub repository,
# open the Actions tab, run "Build Android APK", then download the APK artifact.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the web app
        run: python3 build.py

      - name: Install Capacitor and sync the Android project
        working-directory: android-app
        run: |
          npm ci
          npm run sync

      - name: Build debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: JEF-Maker-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
